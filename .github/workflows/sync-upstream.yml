name: sync-upstream

# 定时同步上游 Mangi-11/Eta 最新 main 到本仓库，自动合并并推送。
# 定制提交（提示词与工具边界）始终留在 main 顶部，以 cherry-pick -x 记录来源。
# 无冲突自动合并；有冲突自动开 issue 通知人工介入，不强制。

on:
  schedule:
    - cron: '0 3 * * *'  # 每日 UTC 03:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置远端
        run: |
          git remote add upstream https://github.com/Mangi-11/Eta.git
          git fetch upstream main
          git config user.name "auto-sync"
          git config user.email "sync@eta-custom.local"

      - name: 检查上游是否有新提交
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "upstream_ahead=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "upstream_ahead=true" >> "$GITHUB_OUTPUT"

      - name: 合并上游
        id: merge
        if: steps.check.outputs.upstream_ahead == 'true'
        run: |
          if git merge --no-ff upstream/main; then
            exit 0
          fi
          # README.md 为本仓库定制版，冲突时固定取本仓库版本；其他文件冲突则放弃合并。
          if git diff --name-only --diff-filter=U | grep -v '^README.md$' | grep -q .; then
            echo "README 以外的文件存在冲突，放弃合并" >&2
            git merge --abort
            exit 1
          fi
          git checkout --ours README.md
          git add README.md
          git commit --no-edit

      - name: 推送合并结果
        if: steps.check.outputs.upstream_ahead == 'true' && steps.merge.outcome == 'success'
        run: git push origin HEAD:refs/heads/main

      - name: 冲突时开 issue 通知
        if: always() && steps.check.outputs.upstream_ahead == 'true' && steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[sync] 上游合并冲突待处理';
            const body = '自动同步 `Mangi-11/Eta` 时发生冲突（README.md 以外的文件），需要人工处理。\n\n' +
              '- 处理方式：本地执行 `git fetch upstream && git merge upstream/main`，' +
              '解决冲突后保留定制功能（提示词与工具边界、会话多选、GitHub 账号等），' +
              '再 `git push origin HEAD:refs/heads/main`。README.md 的冲突会自动取本仓库定制版。\n\n' +
              '关闭本 issue 表示处理完成。';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
