name: Build APK

# 出包流水线：手动触发或推送 v* 标签时触发。
# 无 tag 触发时只上传 artifact；有 tag 时创建 GitHub Release 并附上 APK。
# 签名使用仓库内 signing/eta-custom.jks（自用定制版固定签名，每次构建一致，可覆盖安装）。
# Release 正文 = 一句定位 + 本次更新（上个 tag 以来的提交清单，自动生成）+ 精简安装说明。
# 完整功能介绍在 README，Release 不再重复全量仓库介绍。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 构建 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ github.workspace }}/signing/eta-custom.jks
          ETA_RELEASE_STORE_PASSWORD: etacustom2026
          ETA_RELEASE_KEY_ALIAS: etacustom
          ETA_RELEASE_KEY_PASSWORD: etacustom2026
        run: |
          metadata_arg=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            metadata_arg=("-Peta.buildMetadata=${GITHUB_SHA::7}")
          fi
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" \
            :app:assembleRelease

      - name: 整理产物
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          version=$(basename "$apk" .apk | sed 's/^Eta-v//')
          final="Eta-custom-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$final"
          echo "apk_path=$final" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Eta-custom-APK
          path: ${{ steps.apk.outputs.apk_path }}

      - name: 生成更新日志（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # 取按创建时间排序中、当前 tag 之前最近的一个 tag 作为更新基线
          PREV_TAG=$(git tag --sort=-creatordate | awk -v cur="$GITHUB_REF_NAME" '$0==cur{exit} {prev=$0} END{print prev}')
          {
            echo "CHANGELOG<<EOF"
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty='- %s' "$PREV_TAG..$GITHUB_REF_NAME"
            else
              git log --no-merges --pretty='- %s' -n 50 "$GITHUB_REF_NAME"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Eta-custom ${{ github.ref_name }}

            [Mangi-11/Eta](https://github.com/Mangi-11/Eta) 的个人定制版，完整功能介绍见 [README](https://github.com/fgvsuiye/Eta-custom#readme)。除下列更新外，与上游最新 main 保持一致。

            ## 本次更新

            ${{ env.CHANGELOG }}

            ## 安装说明

            - 需 Android 14+ ARM64 设备（minSdk 34）
            - 包名与上游正式版相同（io.github.mangi.eta）但签名不同：装过官方正式版需先卸载再装本版
            - 与官方 beta（io.github.mangi.eta.beta）可共存
            - 出问题先到上游官方版复现
          files: ${{ steps.apk.outputs.apk_path }}
