name: Build APK

# 出包流水线：手动触发或推送 v* 标签时触发。
# 无 tag 触发时只上传 artifact；有 tag 时创建 GitHub Release 并附上 APK。
# 签名使用仓库内 signing/eta-custom.jks（自用定制版固定签名，每次构建一致，可覆盖安装）。
# Release 说明为手写 Markdown 定制内容，不引用提交链接。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 构建 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ github.workspace }}/signing/eta-custom.jks
          ETA_RELEASE_STORE_PASSWORD: etacustom2026
          ETA_RELEASE_KEY_ALIAS: etacustom
          ETA_RELEASE_KEY_PASSWORD: etacustom2026
        run: |
          metadata_arg=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            metadata_arg=("-Peta.buildMetadata=${GITHUB_SHA::7}")
          fi
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" \
            :app:assembleRelease

      - name: 整理产物
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          version=$(basename "$apk" .apk | sed 's/^Eta-v//')
          final="Eta-custom-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$final"
          echo "apk_path=$final" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Eta-custom-APK
          path: ${{ steps.apk.outputs.apk_path }}

      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Eta-custom ${{ github.ref_name }}

            本仓库是 [Mangi-11/Eta](https://github.com/Mangi-11/Eta) 的个人定制版：提示词与工具边界、GitHub 账号连接移植自 [Oo0520/Eta-por](https://github.com/Oo0520/Eta-por)，会话列表多选为本仓库自研。在上游最新 main 基础上每日自动跟随上游更新，除下述内容外与上游完全一致。

            ## 本地修改

            **提示词工作台**（设置 → 提示词工作台）

            - 自定义系统提示词、人格与追加指令；版本历史与一键回滚
            - 预设管理：内置 7 套预设，支持导入导出（可携带工具集）
            - 请求快照：每轮请求落盘可查——system 提示与工具描述全文，不含密钥与图片
            - 完整性自检：植入文件、注入框架、护栏句子、越狱特征、版本一致性五项只读检查
            - 「当前生效提示词」视图：逐段查看最终发给模型的 system 消息与工具清单

            **工具边界**

            - 工具白名单：按分类/组合勾选可用工具，请求侧与预览侧共用同一目录构建
            - 纯聊天档：不向模型声明任何工具，仅对话（仍可读图）
            - MCP 工具 schema 单独压缩，显著节省上下文占用

            **记忆注入兜底**

            - MEMORY.md 缺少「# 核心记忆」标题时取文件头部注入，不再静默空注入

            **会话列表多选**

            - 长按任意会话进入多选模式，行首勾选框
            - 顶栏操作条：已选计数 / 全选（跟随搜索过滤）/ 批量删除 / 退出
            - 删除前统一确认；运行中的会话先停任务再删；COUI 与 MIUIX 均支持

            **GitHub 账号连接**（移植自 Eta-por）

            - 设置 → GitHub 账号：设备码授权一键登录，无需手动建 PAT
            - token 经 Android Keystore 加密只存本机，断开即清除
            - 连接后自动注册 GitHub 官方远程 MCP（issue、PR、仓库、搜索等）
            - 可选把凭据同步进 Linux 终端环境，git / gh 直接可用

            ## 安装说明

            - 需 Android 13+ ARM64 设备（minSdk 33）
            - 包名与上游正式版相同（io.github.mangi.eta）但签名不同：装过官方正式版需先卸载再装本版
            - 与官方 beta（io.github.mangi.eta.beta）可共存
            - 出问题先到上游官方版复现：仅上述本地修改相关界面/行为属于本仓库，其余一切与上游一致

            ## 更新方式

            本仓库每日自动合并上游 main；上游发新版后，这里出一个新 tag 的 Release 即可跟进。
          files: ${{ steps.apk.outputs.apk_path }}
